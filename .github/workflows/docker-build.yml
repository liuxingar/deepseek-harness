name: Build and Push Docker Image

# 触发条件：
#   1. push 到 master（包括你手动 Sync fork 后的推送）
#   2. 手动触发（Actions 页面点 Run workflow）
#   3. 每天定时同步上游并构建
on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'   # 每天 UTC 03:00 = 北京时间 11:00

permissions:
  contents: write    # 允许同步上游时 push 到 master
  packages: write    # 允许推送到 GHCR

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      # 仅在定时触发时自动同步上游；手动/push 触发不做同步
      - name: Sync upstream (scheduled only)
        if: github.event_name == 'schedule'
        run: |
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git || true
          git fetch upstream master
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge upstream/master --no-edit || (git merge --abort && echo "::warning::Merge conflict; please sync manually")
          # 同步后自动删除上游自带的无关工作流，只保留 docker-build.yml
          find .github/workflows -type f ! -name 'docker-build.yml' -delete 2>/dev/null || true
          git add -A
          git diff --cached --quiet || git commit -m "chore: remove upstream workflows, keep only docker-build"
          git push || echo "Nothing to push"

      # 只构建 amd64（绝大多数 NAS 是 x86_64，构建快 3-5 分钟）
      # 如果你的 NAS 是 ARM 架构，恢复下面两行，并把 platforms 加回 linux/arm64：
      #   - name: Set up QEMU
      #     uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/deepseek-harness:latest
            ghcr.io/${{ github.repository_owner }}/deepseek-harness:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/deepseek-harness:${{ github.ref_name }}
