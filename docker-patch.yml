# Docker 部署 patch
# 1. webserver: 允许容器外（局域网）访问 Web UI
# 2. connection: 把宿主机(群晖)的局域网 IP 加入 /api 信任围栏
#    官方默认只信任 loopback + 容器内自动采样的 LAN IP(172.31.0.2)，
#    浏览器从宿主机 IP 访问时 Host 不在 trustedHosts 会被 403 拒绝。
#    这里从环境变量 DSH_TRUSTED_HOSTS 读取（在 .env / docker-compose 里配置），
#    支持多个地址用英文逗号分隔，例如：192.168.50.100,192.168.50.101
#    注意：!!js 必须是"标量"，所以整个 JS 表达式用双引号包裹（不能以 [ 开头写成 flow 序列，否则解析失败）
- id: webserver
  config:
    host: '0.0.0.0'
    port: 3080
- id: connection
  config:
    trustedHosts: !!js "[...(process.env.DSH_TRUSTED_HOSTS || '').split(',').map(s => s.trim()).filter(Boolean), ...ctx.webRuntime.trustedHosts]"

# 3. 分离「参数配置」与「对话固化数据」的挂载路径
#    参数配置（settings / .credentials.yaml / profiles）留在 DSH_HOME=/app/.dsh；
#    会话历史 / 附件图片 / 投影缓存 重定向到第二个挂载卷 /data
#    （在 docker-compose.yml 里挂 ${DSH_SESSIONS}:/data）。
#    官方对应插件 schema：session-persistence-jsonl.root（必填）、
#    attachment-local.dshHome、storage-json.root。
- id: session-persistence-jsonl
  config:
    root: /data/sessions
- id: attachment-local
  config:
    dshHome: /data
- id: storage-json
  config:
    root: /data/storages
