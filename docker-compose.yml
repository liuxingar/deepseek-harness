# DeepSeek Harness 群晖 NAS 部署（从 GHCR 拉镜像，无需本地构建）
# 用法：docker compose up -d

services:
  dsh-web:
    image: ghcr.io/liuxingar/deepseek-harness:latest
    container_name: deepseek-harness
    ports:
      - "${DSH_PORT:-3080}:3080"
    environment:
      # DeepSeek API Key（必填，在 .env 里配置）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # 可选：自定义 base URL（代理或自建 OpenAI 兼容模型时填）
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
    volumes:
      # agent 工作区（NAS 真实路径，在 .env 的 DSH_WORKSPACE 里配置）
      - "${DSH_WORKSPACE:-./workspace}:/workspace"
      # 会话数据持久化（NAS 真实路径，在 .env 的 DSH_DATA 里配置）
      - "${DSH_DATA:-./data}:/app/.dsh-home"
    restart: unless-stopped
    # 限制内存，防止失控（群晖内存大可以调大）
    deploy:
      resources:
        limits:
          memory: 4G
