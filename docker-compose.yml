# DeepSeek Harness 群晖 NAS 部署（从 GHCR 拉镜像，无需本地构建）
# 用法：docker compose up -d

services:
  dsh-web:
    image: ghcr.io/liuxingar/deepseek-harness:latest
    container_name: deepseek-harness
    ports:
      - "${DSH_PORT:-3080}:3080"
    environment:
      # DeepSeek API Key（必填，在 .env 里配置）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # 可选：自定义 base URL（代理或自建 OpenAI 兼容模型时填）
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      # 群晖的局域网 IP（必填！浏览器访问 dsh 必须在此列表，否则 /api 被 403 拒绝）
      # 多个地址用英文逗号分隔，例如 192.168.50.100,192.168.50.101
      DSH_TRUSTED_HOSTS: ${DSH_TRUSTED_HOSTS:-192.168.50.100}
      # dsh 数据目录（配置/模型设置/API key/会话历史）——必须与下方 volume 映射一致
      # dsh 默认 home 是 ~/.dsh，容器内用户 home 是 /app，故此处设为 /app/.dsh
      DSH_HOME: /app/.dsh
    volumes:
      # agent 工作区（NAS 真实路径，在 .env 的 DSH_WORKSPACE 里配置）
      # 提示：dsh 通过 UI 目录选择器选工作目录，容器内请选择 /workspace
      - "${DSH_WORKSPACE:-./workspace}:/workspace"
      # dsh 配置/凭据/会话数据（NAS 真实路径，在 .env 的 DSH_DATA 里配置）
      # 必须挂到 /app/.dsh（即 DSH_HOME），挂错目录会导致配置丢失
      - "${DSH_DATA:-./data}:/app/.dsh"
    restart: unless-stopped
    # 限制内存，防止失控（群晖内存大可以调大）
    deploy:
      resources:
        limits:
          memory: 4G
